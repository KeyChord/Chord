# Packages Chord installs, at these revisions, on first launch and when chords are reset. An
# install with one at another revision sees this one as an update in Browse; Chord never moves an
# installed package by itself.
# Pin each to its mirror's commit, and run `vpx _e2e-macos journey --build` after changing one:
# its last steps fail when a default package has chords this app can't load.
#
# When you change a pin, first copy the set below, as it was released, to the top of [[previous]].

[packages."@keychord/chords-chord"]
git = "https://github.com/KeyChord/chords-chord"
rev = "1b9d92ab1cec81ea3b61cfa78f367957e8b69214"

# The menu bar, plus the system chords (force quit, lock, volume, brightness) that used to be
# in chords-os.
[packages."@keychord/chords-menu"]
git = "https://github.com/KeyChord/chords-menu"
rev = "4c297eec8f2153a272b4fc6edcf09cbb192e431c"

# Only names for Apple's apps; each app's chords are a package of its own.
[packages."@keychord/chords-com.apple"]
git = "https://github.com/KeyChord/chords-com.apple"
rev = "9010297dace1157131de9814cba5b92054a68c41"

[packages."@keychord/chords-com.apple.finder"]
git = "https://github.com/KeyChord/chords-com.apple.finder"
rev = "5932147fb0eabcafd96f47a77dbe1ca807e180a1"

[packages."@keychord/chords-com.apple.Safari"]
git = "https://github.com/KeyChord/chords-com.apple.Safari"
rev = "24da767c2f33fe419705227280d6377fa8dabafe"

[packages."@keychord/chords-com.apple.ActivityMonitor"]
git = "https://github.com/KeyChord/chords-com.apple.ActivityMonitor"
rev = "d909f915d09958ed8950df6d6139f62cb54a6d0c"

[packages."@keychord/chords-com.apple.AccessibilityInspector"]
git = "https://github.com/KeyChord/chords-com.apple.AccessibilityInspector"
rev = "2f2a63aa5a8add31147d563cac31de1ce0157849"

# The built-in `/` launcher, which opens Spotlight's top result for a query. It is a fallback
# chord, so other `/` chords win, and an installed launcher such as chords-raycast replaces it.
[packages."@keychord/chords-com.apple.Spotlight"]
git = "https://github.com/KeyChord/chords-com.apple.Spotlight"
rev = "baecaa792d601efa13afe38f3fd0ff77aa8a9c0f"

