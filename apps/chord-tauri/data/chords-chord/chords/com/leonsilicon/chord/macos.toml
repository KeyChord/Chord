name = 'Chords'

# This core file is always loaded globally and cannot be removed or disabled.
# Other packages cannot define chords or hints in the reserved 0 namespace.

[chords]
'?"1-9"' = { name = 'Repeat count' }

# By convention `/` launches things. Many packages add to it and none owns it.
'?/' = { name = 'Launch' }

'?0' = { name = 'Chord' }

'0,' = { name = 'Chord: Settings', builtin = { command = 'settings' } }
'0,r' = { name = 'Chord: Settings > Reload', builtin = { command = 'reload' } }
'0q' = { name = 'Chord: Quit', builtin = { command = 'quit' } }

'?0l' = { name = 'Chord: Layout' }
'0ls' = { name = 'Layout: Sidebar left', builtin = { command = 'set-layout', argument = 'sidebar-left' } }
'0lsl' = { name = 'Layout: Sidebar left', builtin = { command = 'set-layout', argument = 'sidebar-left' } }
'0lf' = { name = 'Layout: Floating bottom', builtin = { command = 'set-layout', argument = 'floating-bottom' } }
'0lfb' = { name = 'Layout: Floating bottom', builtin = { command = 'set-layout', argument = 'floating-bottom' } }
'0lv' = { name = 'Layout: Cycle', builtin = { command = 'cycle-layout' } }

'?0h' = { name = 'Chord: Halt (Loop)' }
'0h(\d+)' = { name = 'Halt loop #$1', builtin = { command = 'halt-loop', argument = '$1' } }

# Buffers and names starting with a digit are temporary; other names persist.
# An empty sequence clears the value.
'?0b' = { name = 'Chord: Save temporary buffer (1–9)' }
'0b([1-9].*)' = { name = 'Save temporary buffer', builtin = { command = 'set-buffer', argument = '$1' } }
'?0=' = { name = 'Chord: Save named macro' }
'0=([^=]+=.*)' = { name = 'Save named macro', builtin = { command = 'set-macro', argument = '$1' } }
