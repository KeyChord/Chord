[package]
name = "chords"
version = "0.1.0"
description = "shortcuts reimagined"
edition = "2024"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
	"crates/taurpc_macros",
]

# Production code propagates errors rather than panicking; a panic in a main-thread
# AppKit callback takes down the whole app. Does not fire in `#[cfg(test)]` code.
[lints.clippy]
unwrap_used = "warn"

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chords_lib"
crate-type = [
	"staticlib",
	"cdylib",
	"rlib"
]

[[bin]]
name = "chord"
path = "src/main.rs"

[[example]]
name = "file-picker"
path = "tests/file-picker/listener.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
	"macos-private-api",
	"tray-icon",
	"image-png"
] }
taurpc-macros = { path = "./crates/taurpc_macros" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7.0"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = ["float_roundtrip"] }
shlex = "2"
base64 = "0.23"
tokio = { version = "1", features = [ "full" ] }
tauri-plugin-user-input = "0.1.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-log = "2"
log = "*"
rdev = { git = "https://github.com/KeyChord/rdev", features = [
	"unstable_grab",
	"x11"
] }
observable-property = "0.4.4"
toml = "1.1.8"
anyhow = "1.0"
regex = "1.13.1"
libc = "0.2"
bitflags = "2.13"
parking_lot = { version = "0.12", features = [ "deadlock_detection" ] }
clap = { version = "4.6", features = [ "derive" ] }
keycode = "1"
device_query = "4"
walkdir = "2.5.0"
gix = { version = "0.89.0", features = [ "blocking-http-transport-reqwest-rust-tls" ] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
mac-keycode = "0.0.2"
rbun = { path = "../../../../rbun/crates/rbun" }
tauri-plugin-store = "2"
jsonc-parser = "0.34.0"
typeshare = "1"
specta = { version = "=2.0.0-rc.25", features = [ "derive" ] }
taurpc = "0.8.2"
thiserror = "2.0.21"
arc-swap = "1.9"
ordermap = "1.2"
frontmost = { git = "https://github.com/KeyChord/frontmost" }
elevated-command = "1.1.3"
uuid = { version = "1", features = ["v4", "fast-rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-log = "0.2" # This is the bridge
atomic_enum = "0.3"
derive_more = { version = "2", features = ["display"] }
nject = "0.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [ "block2" ] }
objc2-foundation = { version = "0.3.2", features = [ "block2" ] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "CSCommon", "SecCode", "SecStaticCode"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "hid", "hidsystem", "libc"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXError", "libc"] }
macos-accessibility-client = "0.0.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }
raw-window-handle = "0.6"
window-vibrancy = "0.8"
osakit = "0.3.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7.0"
