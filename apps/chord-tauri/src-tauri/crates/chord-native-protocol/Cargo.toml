[package]
name = "chord-native-protocol"
version = "0.1.0"
edition = "2024"
description = "IPC protocol and client shared between Chord and chord-native-host"

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "process", "time", "macros", "rt"] }
libc = "0.2"
