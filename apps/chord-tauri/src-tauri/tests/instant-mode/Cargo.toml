[package]
name = "chord-instant-mode-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "portable.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
derive_more = { version = "2", features = ["display"] }
keycode = "1"
typeshare = "1"
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
parking_lot = "0.12"
log = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
device_query = "4"
mac-keycode = "0.0.2"
rdev = { git = "https://github.com/KeyChord/rdev" }
