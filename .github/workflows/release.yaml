name: release

# Every push to `beta` or `prod` publishes a new versioned release: `v<version>-beta`
# is a prerelease built with the beta identity, and `v<version>` is the latest
# release built with the production identity from tauri.conf.json. Raise the app
# version before each release on a channel. Published releases and their assets
# are never replaced. The rolling `beta` release only keeps existing beta download
# and updater URLs working. Promoting a build means pushing its commit to `prod`.
#
# Signing: each Apple / Tauri signing step is gated on its secret (these live at
# the org level). With them present the build is Developer ID signed and
# notarized; without one `beta` degrades to an ad-hoc signed build, and any
# other build fails rather than reach new users un-notarized.
#
# Running this by hand from any other branch builds and notarizes without
# publishing, leaving the result as the run's artifacts:
#   gh workflow run release --ref <branch>

on:
  workflow_dispatch:
  push:
    branches:
      - beta
      - prod

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_CHANNEL: ${{ github.ref_name }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            macho_arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            macho_arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      # `secrets` is not available in step-level `if:`, but `env` is.
      APPLE_CERT_B64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_FILE_BASE64 }}
    defaults:
      run:
        working-directory: Chord
    steps:
      # Both repos are checked out side by side under GITHUB_WORKSPACE, because
      # `Cargo.toml` depends on rbun by relative path: from
      # `Chord/apps/chord-tauri/src-tauri`, `../../../../rbun` resolves to the
      # sibling `rbun` directory here. checkout refuses a `path` outside the
      # workspace, so nesting Chord one level down is what makes that line up.
      # The prebuilt dylib downloaded below only satisfies the *linker*; cargo
      # still needs rbun's source manifest to resolve the dependency at all.
      - uses: actions/checkout@v6
        with:
          path: Chord

      - name: Checkout rbun
        uses: actions/checkout@v6
        with:
          repository: KeyChord/rbun
          # Pin the source to the ABI of the prebuilt macOS libraries used by Chord.
          ref: 4d61e15430e303287aac5d33b26b094627783127
          path: rbun

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # setup-toolchain runs `proto install` at the workspace root, which no
      # longer holds `.prototools` now that Chord is checked out one level down,
      # and it has no working-directory input. Install the two pinned tools
      # directly instead: the versions come from `.prototools` and
      # `rust-toolchain.toml`.
      - name: Read pinned bun version
        id: tools
        working-directory: .
        run: |
          set -euo pipefail
          # setup-bun cannot read .prototools, so parse the pin out of it and
          # keep .prototools the single source of truth.
          v="$(sed -n 's/^bun[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' Chord/.prototools)"
          test -n "$v" || { echo "::error::no bun pin in .prototools"; exit 1; }
          echo "bun=$v" >> "$GITHUB_OUTPUT"
          echo "bun $v"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.tools.outputs.bun }}

      - name: Setup rust
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the channel and targets; rustup honours it
          # automatically for every cargo invocation inside the repo.
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Chord/apps/chord-tauri/src-tauri -> target
          key: ${{ matrix.target }}

      # The `bun` cargo feature links libbun_embed.dylib from the sibling rbun
      # checkout, which does not exist on CI. Pull the prebuilt dylib that
      # KeyChord/rbun publishes for this architecture instead.
      - name: Download libbun_embed
        id: bunlib
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bun-embed"
          mkdir -p "$dir"
          asset="libbun_embed-${{ matrix.target }}.dylib"
          # rbun tags each build by the Bun source commit it pins, and Chord
          # links against that commit's embedding API, so only that release
          # fits; an older one fails at link time on a missing symbol. The rbun
          # checkout holds the submodule's commit without fetching Bun.
          sha="$(git -C ../rbun ls-tree HEAD packages/com/github/oven-sh/bun/src | awk '{print $3}')"
          test -n "$sha" || { echo "::error::rbun does not pin a Bun submodule commit"; exit 1; }
          tag="bun-embed-${sha:0:12}"
          # Not a pipe into grep: with pipefail, grep leaving at its first match can
          # kill gh with a broken pipe, which looks the same as no match.
          if ! names="$(gh release view "$tag" -R KeyChord/rbun --json assets --jq '.assets[].name')" \
             || ! grep -qxF "$asset" <<<"$names"; then
            echo "::error::KeyChord/rbun has no $asset for Bun ${sha:0:12} (release $tag); run its build-bun-embed workflow first"
            exit 1
          fi
          echo "using $tag / $asset"
          gh release download "$tag" -R KeyChord/rbun --pattern "$asset" --dir "$dir" --clobber
          mv "$dir/$asset" "$dir/libbun_embed.dylib"
          lipo -info "$dir/libbun_embed.dylib"
          lipo "$dir/libbun_embed.dylib" -verify_arch "${{ matrix.macho_arch }}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri.conf.json points `bundle.macOS.frameworks` at the local rbun
      # checkout. tauri.conf.json carries the production identity and the
      # checked-in beta config overrides it for beta; this generated overlay
      # only points the build at the downloaded dylib.
      - name: Build CI framework config
        id: cfg
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log(JSON.parse(await Bun.file("apps/chord-tauri/src-tauri/tauri.conf.json").text()).version)')"
          short="${GITHUB_SHA:0:7}"
          cfg="apps/chord-tauri/src-tauri/tauri.ci.conf.json"
          bun -e '
            const dylib = process.argv[1] + "/libbun_embed.dylib";
            await Bun.write(process.argv[2], JSON.stringify({
              bundle: { macOS: { frameworks: [dylib], signingIdentity: "-" } },
            }, null, 2));
          ' "${{ steps.bunlib.outputs.dir }}" "$cfg"
          cat "$cfg"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "config=src-tauri/tauri.ci.conf.json" >> "$GITHUB_OUTPUT"

      - name: Import Apple certificate
        id: cert
        if: ${{ env.APPLE_CERT_B64 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_FILE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Resolve signing identity
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERT_B64:-}" ]; then
            id="$(security find-identity -v -p codesigning signing_temp.keychain \
                  | grep "Developer ID Application" | head -n1 | awk -F'"' '{print $2}')"
            echo "identity=$id" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Apple certificate secret; ad-hoc signing"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select bundle targets
        id: bundles
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # tauri hard-errors when an Updater-type bundle is requested while
          # `plugins.updater.pubkey` is set but TAURI_SIGNING_PRIVATE_KEY is not
          # ("A public key has been found, but no private key"). Building only
          # the app skips updater signing entirely, so the unsigned path works.
          # The disk image is made afterwards, from the notarized app.
          if [ -n "${UPDATER_KEY:-}" ]; then
            echo "bundles=app,updater" >> "$GITHUB_OUTPUT"
          else
            echo "no updater signing key; building the app only"
            echo "bundles=app" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        working-directory: Chord/apps/chord-tauri
        env:
          RBUN_BUN_LIB_DIR: ${{ steps.bunlib.outputs.dir }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_FILE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          channel_config=""
          if [ "$RELEASE_CHANNEL" = beta ]; then
            channel_config="src-tauri/tauri.beta.conf.json"
          fi
          bun tauri build \
            --target ${{ matrix.target }} \
            ${channel_config:+--config "$channel_config"} \
            --config ${{ steps.cfg.outputs.config }} \
            --bundles ${{ steps.bundles.outputs.bundles }}

      - name: Stage assets
        id: stage
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle="apps/chord-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          suffix="${{ matrix.arch }}"
          scripts="packages/dev/improve/chord/configs/release/macos"

          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$app" || { echo "::error::no .app produced"; exit 1; }
          # XProtect won't open an app whose rpath leads outside it, such as into this runner's
          # build directory, however it's signed: "Apple could not verify Chord is free of malware".
          bun "$scripts/_check-load-paths.ts" "$PWD/$app" \
            || { echo "::error::the app could load code from outside itself; see above"; exit 1; }
          dmg="$out/Chord-$suffix.dmg"
          notarizing=false
          if [ "${{ steps.signing.outputs.signed }}" = true ] && [ -n "${APPLE_ID:-}" ]; then
            notarizing=true
          fi
          # Tauri doesn't check whether stapling the app worked, and on these runners
          # it can lose its connection to Apple. Make sure before the app goes in the DMG.
          if [ "$notarizing" = true ]; then
            bun "$scripts/_notarize.ts" --staple "$PWD/$app"
          fi
          # Tauri's own DMG has a blank window on CI, where Finder can't be scripted.
          bun "$scripts/_make-dmg.ts" \
            "$PWD/$app" "$dmg" "$PWD/apps/chord-tauri/src-tauri/icons/icon.icns"
          # Tauri notarized the app, but spctl assesses the disk image apart from it.
          if [ "$notarizing" = true ]; then
            bun "$scripts/_notarize.ts" "$dmg"
          fi

          # Sanity-check that the embedded Bun runtime actually shipped.
          test -f "$app/Contents/Frameworks/libbun_embed.dylib" \
            || { echo "::error::libbun_embed.dylib missing from bundle"; exit 1; }

          # When the updater bundle ran it already produced a signed archive;
          # reuse it so the archive and its .sig stay a matched pair. Otherwise
          # roll our own plain archive of the .app.
          updater="$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n1)"
          if [ -n "$updater" ]; then
            cp "$updater" "$out/Chord-$suffix.app.tar.gz"
            if [ -e "$updater.sig" ]; then
              cp "$updater.sig" "$out/Chord-$suffix.app.tar.gz.sig"
            fi
          else
            tar -czf "$out/Chord-$suffix.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          fi

          # spctl only exists on macOS, so record the Gatekeeper verdict here for
          # the ubuntu publish job to read.
          if bun "$scripts/_notarize.ts" --check "$PWD/$app" "$dmg"; then
            echo notarized > "$out/gatekeeper.txt"
          elif [ "$RELEASE_CHANNEL" = beta ]; then
            echo unsigned > "$out/gatekeeper.txt"
          else
            echo "::error::this build isn't fully notarized, so it can't be released; the reason is above"
            exit 1
          fi
          cat "$out/gatekeeper.txt"

          ls -la "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chord-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.dir }}/*
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            bundle-dir: appimage
            extension: AppImage
            asset: Chord-linux-x86_64.AppImage
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle-dir: nsis
            extension: exe
            asset: Chord-windows-x86_64-setup.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: Chord
    steps:
      - uses: actions/checkout@v6
        with:
          path: Chord
      # Cargo reads the sibling manifest even when rbun is excluded from this target.
      - uses: actions/checkout@v6
        with:
          repository: KeyChord/rbun
          # Pin the source to the ABI of the prebuilt macOS libraries used by Chord.
          ref: 4d61e15430e303287aac5d33b26b094627783127
          path: rbun
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Resolve Bun pin
        id: tools
        run: |
          bun_version="$(sed -n 's/^bun[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' .prototools)"
          test -n "$bun_version"
          echo "bun=$bun_version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils patchelf
      - name: Setup Rust
        run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Chord/apps/chord-tauri/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stage Bun sidecar
        run: bun apps/chord-tauri/_stage-bun.ts ${{ matrix.target }}
      - name: Check desktop backend
        working-directory: Chord/apps/chord-tauri/src-tauri
        run: |
          cargo test --locked --lib --target ${{ matrix.target }} bun_js::protocol::tests
          cargo test --locked --lib --target ${{ matrix.target }} caps_lock_guard::tests
      - name: Build desktop installers
        working-directory: Chord/apps/chord-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=()
          if [ "$RELEASE_CHANNEL" = beta ]; then
            args+=(--config src-tauri/tauri.beta.conf.json)
          fi
          bun tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${args[@]}"
      - name: Stage desktop assets
        run: |
          set -euo pipefail
          bundle="apps/chord-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p "$RUNNER_TEMP/desktop-assets"
          destination="$RUNNER_TEMP/desktop-assets/${{ matrix.asset }}"
          installers=("$bundle"/${{ matrix.bundle-dir }}/*.${{ matrix.extension }})
          test "${#installers[@]}" = 1
          cp "${installers[0]}" "$destination"
          cp "${installers[0]}.sig" "$destination.sig"
          if [ "${{ runner.os }}" = Linux ]; then
            cp "$bundle"/deb/*.deb "$RUNNER_TEMP/desktop-assets/Chord-linux-x86_64.deb"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chord-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-assets/*
          if-no-files-found: error

  publish:
    # Manual runs from other branches only produce build artifacts.
    if: ${{ github.ref_name == 'beta' || github.ref_name == 'prod' }}
    needs: [build, build-desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la assets
          short="${GITHUB_SHA:0:7}"
          version="$(jq -er .version apps/chord-tauri/src-tauri/tauri.conf.json)"
          # Say which it is rather than hardcoding a claim: the signing steps are
          # secret-gated, so an unsigned build is possible if a secret is removed.
          # The verdict comes from the macOS build job (spctl is not on ubuntu).
          if grep -qx notarized assets/gatekeeper.txt 2>/dev/null; then
            gatekeeper="Signed and notarized — just open it."
          else
            gatekeeper="This build is not notarized; on first launch, right-click the app and choose **Open**."
          fi
          rm -f assets/gatekeeper.txt
          # Production is the repository's latest release, which the production
          # updater endpoint (releases/latest) resolves to; beta never is.
          if [ "$RELEASE_CHANNEL" = prod ]; then
            tag="v$version"
            title="Chord $version"
            channel="production"
            endpoint="https://github.com/KeyChord/Chord/releases/latest/download/latest.json"
            flags=(--prerelease=false --latest)
          else
            tag="v$version-beta"
            title="Chord $version Beta"
            channel="beta"
            endpoint="https://github.com/KeyChord/Chord/releases/download/beta/latest.json"
            flags=(--prerelease --latest=false)
          fi
          download="macOS: choose the DMG for Apple Silicon (aarch64) or Intel (x86_64). Linux x86_64: choose the AppImage or Debian package and follow the X11 input setup in the README. Windows x86_64: choose the setup.exe installer."
          notes="Automatic $channel build from \`$RELEASE_CHANNEL\` @ ${short}. $download $gatekeeper"

          # What installed copies of Chord read to update themselves. The updater only installs a
          # higher version. Read the moving endpoint, not the retired rolling production release.
          status="$(curl -sSL -o published.json -w '%{http_code}' "$endpoint")"
          case "$status" in
            200) published="$(jq -er .version published.json)" ;;
            404) published="" ;;
            *) echo "::error::couldn't read the published $channel version (HTTP $status)"; exit 1 ;;
          esac
          if [ -n "$published" ] \
            && [ "$(printf '%s\n%s\n' "$published" "$version" | sort -V | tail -n1)" != "$version" -o "$published" = "$version" ]; then
            echo "::error::version $version isn't above the published $published; raise it in apps/chord-tauri/src-tauri/tauri.conf.json and Cargo.toml"
            exit 1
          fi
          # Only an unfinished draft from this exact commit can be resumed. Published releases
          # never get their dates, tags, or assets changed by a later run.
          existing="$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null || true)"
          if [ -n "$existing" ] && ! jq -e --arg sha "$GITHUB_SHA" \
            '.isDraft and .targetCommitish == $sha' <<<"$existing" >/dev/null; then
            echo "::error::$tag already exists; raise the app version for a new release"
            exit 1
          fi
          # An installed copy keeps the release it was offered, signature included, until it
          # checks again (at launch, then daily). If the archive at that URL were replaced in
          # between, the download would no longer match the signature and the update would fail.
          # Each manifest points directly at its versioned release. Keep all older releases,
          # including the rolling prod/beta archives that installed copies may still download.
          base="https://github.com/KeyChord/Chord/releases/download/$tag"
          mkdir -p archives manifest
          declare -A url signature
          for arch in aarch64 x86_64; do
            if [ ! -s "assets/Chord-$arch.app.tar.gz.sig" ]; then
              echo "::error::Chord-$arch.app.tar.gz has no updater signature, so installed copies couldn't verify it"
              exit 1
            fi
            hash="$(sha256sum "assets/Chord-$arch.app.tar.gz" | cut -c1-16)"
            name="Chord-$version-$arch-$hash.app.tar.gz"
            mv "assets/Chord-$arch.app.tar.gz" "archives/$name"
            # The signature goes in latest.json, which is what the updater reads.
            signature[$arch]="$(cat "assets/Chord-$arch.app.tar.gz.sig")"
            rm "assets/Chord-$arch.app.tar.gz.sig"
            url[$arch]="$base/$name"
          done
          for installer in Chord-linux-x86_64.AppImage Chord-windows-x86_64-setup.exe; do
            test -s "assets/$installer" && test -s "assets/$installer.sig"
          done
          jq -n \
            --arg version "$version" \
            --arg notes "Chord $version from \`$RELEASE_CHANNEL\` @ ${short}." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg arm "${signature[aarch64]}" \
            --arg arm_url "${url[aarch64]}" \
            --arg intel "${signature[x86_64]}" \
            --arg intel_url "${url[x86_64]}" \
            --rawfile linux assets/Chord-linux-x86_64.AppImage.sig \
            --arg linux_url "$base/Chord-linux-x86_64.AppImage" \
            --rawfile windows assets/Chord-windows-x86_64-setup.exe.sig \
            --arg windows_url "$base/Chord-windows-x86_64-setup.exe" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $arm, url: $arm_url},
              "darwin-x86_64": {signature: $intel, url: $intel_url},
              "linux-x86_64": {signature: ($linux | rtrimstr("\n") | rtrimstr("\r")), url: $linux_url},
              "windows-x86_64": {signature: ($windows | rtrimstr("\n") | rtrimstr("\r")), url: $windows_url}
            }}' > manifest/latest.json
          rm assets/Chord-linux-x86_64.AppImage.sig assets/Chord-windows-x86_64-setup.exe.sig
          jq '{version, pub_date, platforms: (.platforms | keys)}' manifest/latest.json

          if [ -z "$existing" ]; then
            # Pin the tag to the commit that was actually built rather than
            # whatever the default branch points at by the time this runs. Keep
            # it a draft until both architectures and their manifest are uploaded.
            gh release create "$tag" --draft \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest=false
          fi
          # Replacement is safe only while the release is still an unpublished draft.
          gh release upload "$tag" archives/* assets/* manifest/latest.json --clobber
          gh release edit "$tag" --draft=false --title "$title" --notes "$notes" "${flags[@]}"

          if [ "$RELEASE_CHANNEL" = beta ]; then
            # Existing beta apps have this endpoint compiled in. Its manifest now
            # points to the versioned release; leave all its older archives alone.
            if ! gh release view beta >/dev/null 2>&1; then
              gh release create beta --target "$GITHUB_SHA" \
                --title "Chord Beta downloads" --notes "Downloads and updater endpoint for the latest versioned beta release." \
                --prerelease --latest=false
            fi
            gh release upload beta assets/* --clobber
            gh release upload beta manifest/latest.json --clobber
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'

  deploy-website:
    if: ${{ github.ref == 'refs/heads/prod' }}
    needs: publish
    permissions: {}
    runs-on: ubuntu-latest
    environment: website-deploy
    steps:
      - name: Create website workflow token
        id: website-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.WEBSITE_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEBSITE_DEPLOY_APP_PRIVATE_KEY }}
          owner: KeyChord
          repositories: trychord.app
          permission-actions: write

      - name: Redeploy trychord.app
        env:
          GH_TOKEN: ${{ steps.website-token.outputs.token }}
        run: gh api --method POST repos/KeyChord/trychord.app/actions/workflows/deploy.yaml/dispatches -f ref=prod
